[package]
name = "agave-precompiles"
description = "In-tree precompiles sources, pinned to delorean-client's agave-feature-set rc.0"
version = "4.0.0"
edition = "2021"
publish = false

[features]
agave-unstable-api = []

[dependencies]
agave-feature-set = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
bincode = "1.3.3"
ed25519-dalek = "=1.0.1"
libsecp256k1 = { version = "0.7.2", default-features = false, features = [
    "std",
    "static-context",
    "hmac",
] }
openssl = "0.10"
solana-ed25519-program = "3.0.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-message = "3.1.0"
solana-precompile-error = "3.0.0"
solana-pubkey = { version = "4.1.0", default-features = false }
solana-sdk-ids = "3.1.0"
solana-secp256k1-program = { version = "3.0.1", features = ["serde"] }
solana-secp256r1-program = { version = "3.0.0", features = ["openssl-vendored"] }

[lints]
workspace = true
