[workspace]
members = ["delorean-client", "penrose-types"]
resolver = "2"

[workspace.package]
version = "4.0.0-rc.0"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/agave"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.lints.rust]
boxed_slice_into_iter = "deny"
dependency_on_unit_never_type_fallback = "deny"
deprecated_safe_2024 = "deny"
impl_trait_overcaptures = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
static_mut_refs = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
    'cfg(target_arch, values("sbf"))',
]

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
default_trait_access = "deny"
manual_let_else = "deny"
used_underscore_binding = "deny"

[workspace.dependencies]
agave-feature-set = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
agave-penrose-types = { path = "penrose-types", version = "=4.0.0-rc.0" }
agave-reserved-account-keys = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
agave-syscalls = { version = "=4.0.0-rc.0", default-features = false, features = [
    "agave-unstable-api",
] }
ahash = "0.8.12"
base64 = "0.22.1"
bincode = "1.3.3"
serde_json = "1.0.149"
solana-account = "3.4.0"
solana-address = "=2.5.0"
solana-bpf-loader-program = { version = "=4.0.0-rc.0", default-features = false, features = [
    "agave-unstable-api",
] }
solana-bls-signatures = "=3.2.0"
solana-clock = "3.0.1"
solana-compute-budget-instruction = { version = "=4.0.0-rc.0", features = [
    "agave-unstable-api",
] }
solana-compute-budget-program = { version = "=4.0.0-rc.0", features = [
    "agave-unstable-api",
] }
solana-fee-structure = "3.0.0"
solana-hash = { version = "=4.2.0", features = ["copy"] }
solana-loader-v3-interface = "6.1.0"
solana-loader-v4-interface = "3.1.0"
solana-message = "3.1.0"
solana-program-runtime = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-pubkey = { version = "4.1.0", default-features = false }
solana-rent = "3.0.0"
solana-rpc-client = { version = "=4.0.0-rc.0", default-features = false }
solana-rpc-client-api = { version = "=4.0.0-rc.0" }
solana-runtime = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.1.0"
solana-signature = { version = "=3.3.0", default-features = false }
solana-svm = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-svm-callback = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-svm-transaction = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-system-program = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
solana-transaction = { version = "3.1.0", features = ["blake3", "serde"] }
solana-transaction-context = { version = "=4.0.0-rc.0", features = [
    "agave-unstable-api",
    "bincode",
] }
solana-transaction-error = { version = "3.2.0", features = ["serde"] }
solana-version = { version = "=4.0.0-rc.0", features = ["agave-unstable-api"] }
thiserror = "2.0.18"
wincode = { version = "=0.4.9", features = ["derive"] }
